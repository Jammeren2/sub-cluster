# Приложение слушает порт 2347 на хосте. Домен/HTTPS навесишь сам сверху.
#
# Параметры задаются прямо здесь. Значение после ":-" — по умолчанию;
# его можно переопределить переменной окружения при запуске, например:
#   SUB_PATH=/s/мойсекрет docker compose up -d
services:
  sub-mirror:
    build: .
    image: concord-sub-mirror
    container_name: sub-mirror
    restart: unless-stopped
    # Хост:контейнер. Внутри контейнера всегда 8080, наружу — 2347.
    ports:
      - "${HOST_PORT:-2347}:8080"
    # Персистентный конфиг маршрутов (созданные в веб-панели подписки).
    volumes:
      - ./data:/data
    environment:
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "8080"
      # Конфиг маршрутов хранится здесь (в смонтированном volume /data).
      CONFIG_FILE: "/data/config.json"
      # ── Веб-панель управления маршрутизированием ──
      # Путь панели (по умолчанию /admin).
      ADMIN_PATH: "${ADMIN_PATH:-/admin}"
      # Логин/пароль панели — ОБЯЗАТЕЛЬНО поменяй.
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
      # ── Легаси-зеркало (необязательно): если задать оба, при ПЕРВОМ запуске
      #    создаётся маршрут-зеркало. Дальше всё настраивается в панели. ──
      UPSTREAM_URL: "${UPSTREAM_URL:-}"
      SUB_PATH: "${SUB_PATH:-}"
      PROFILE_TITLE: "${PROFILE_TITLE:-}"
      # Кэш ответа upstream, сек.
      CACHE_TTL: "${CACHE_TTL:-60}"
      # HWID клиента Happ (обычно менять не нужно).
      HAPP_HWID: "${HAPP_HWID:-00000000-0000-0000-0000-000000000000}"
      # Аварийно отключить проверку TLS: INSECURE_TLS=1
      INSECURE_TLS: "${INSECURE_TLS:-}"
