# Развёртывание одного узла кластера (для серверов БЕЗ Coolify).
# На узле с Coolify деплой через его UI — см. README (тот же образ и env).
#
# Параметры узла — в файле .env рядом (скопируй .env.example → .env и заполни).
# Caddy терминирует HTTPS для обоих доменов и проксирует на приложение.
# Сертификаты выдаются on-demand: пока домен не указывает на этот узел, серт не
# нужен; как только DNS переключится сюда — Caddy выпустит серт при первом запросе.

services:
  app:
    build: .
    image: sub-cluster
    container_name: sub-cluster-app
    restart: unless-stopped
    env_file: .env
    environment:
      LISTEN_HOST: "0.0.0.0"
      ADMIN_PORT: "8080"
      SUB_PORT: "8081"
      CLUSTER_PORT: "8083"
      DB_FILE: "/data/cluster.db"
      PYTHONUNBUFFERED: "1"
    volumes:
      - cluster-data:/data
    ports:
      # peer-API кластера — ДОЛЖЕН быть доступен другим узлам по публичному IP.
      - "8083:8083"
    expose:
      - "8080"
      - "8081"

  caddy:
    image: caddy:2
    container_name: sub-cluster-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  cluster-data:
  caddy-data:
  caddy-config:
