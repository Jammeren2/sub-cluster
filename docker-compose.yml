# Деплой через COOLIFY (узел с Coolify).
# Только приложение — HTTPS и маршрутизацию доменов делает встроенный прокси
# Coolify (Traefik). Свой Caddy здесь НЕ нужен (он бы конфликтовал за 80/443).
#
# В Coolify после деплоя задай домены сервиса app:
#   <admin-домен этого узла, напр. admin.example.net> → порт 8080
#   <домен подписок, happ.example.com>                    → порт 8081
# (в Coolify: Service app → Domains, либо SERVICE_FQDN_APP_8080 / _8081).
#
# Узлы общаются друг с другом через СТАТИЧНЫЙ admin-домен по 443 (CLUSTER_URL),
# который и так проксирует Coolify → отдельный порт кластера наружу публиковать
# НЕ нужно (peer-API доступен на 8080 через admin-домен). Маппинг порта ниже
# оставлен опционально (фолбэк по IP), для основной схемы он не требуется.
#
# Переменные узла (NODE_ID, NODE_PUBLIC_IP, NODE_PRIORITY, CLUSTER_URL,
# CLUSTER_SECRET, SECRET_KEY, ADMIN_PASSWORD, PEERS) задаются в Coolify (Env Vars).
# CLUSTER_URL = admin-домен этого узла, напр. https://admin.example.net
# PEERS = admin-домены ДРУГИХ узлов через запятую, напр.
#         https://admin2.example.net,https://admin3.example.net
#
# Для серверов БЕЗ Coolify используй docker-compose.standalone.yml (там есть Caddy).

services:
  app:
    build: .
    image: sub-cluster
    restart: unless-stopped
    environment:
      LISTEN_HOST: "0.0.0.0"
      ADMIN_PORT: "8080"
      SUB_PORT: "8081"
      CLUSTER_PORT: "${CLUSTER_PORT:-1753}"
      DB_FILE: "/data/cluster.db"
      PYTHONUNBUFFERED: "1"
      # Идентичность узла и секреты — задай в Coolify (Environment Variables):
      #   NODE_ID, NODE_LABEL, NODE_PUBLIC_IP, NODE_PRIORITY, PEERS,
      #   CLUSTER_SECRET, SECRET_KEY, ADMIN_USER, ADMIN_PASSWORD
      NODE_ID: "${NODE_ID:-node1}"
      NODE_LABEL: "${NODE_LABEL:-}"
      NODE_PUBLIC_IP: "${NODE_PUBLIC_IP:-}"
      NODE_PRIORITY: "${NODE_PRIORITY:-1}"
      # Адрес этого узла для пиров (его статичный admin-домен по 443).
      CLUSTER_URL: "${CLUSTER_URL:-}"
      PEERS: "${PEERS:-}"
      CLUSTER_SECRET: "${CLUSTER_SECRET:-}"
      SECRET_KEY: "${SECRET_KEY:-}"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      CACHE_TTL: "${CACHE_TTL:-60}"
    volumes:
      - cluster-data:/data
    # чтобы контейнер мог дёрнуть локальный redeploy-вебхук на хосте (если используешь агент)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Домены admin/sub проксирует Coolify по внутренней сети (порты 8080/8081).
    expose:
      - "8080"
      - "8081"
    # peer-API кластера — публикуем на хост, доступен другим узлам по IP.
    ports:
      - "1753:1753"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).read()==b'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  cluster-data:
