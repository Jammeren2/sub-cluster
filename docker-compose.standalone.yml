# Деплой на узле БЕЗ Coolify: приложение + Caddy (HTTPS для обоих доменов).
# Запускать из каталога репозитория, чтобы бинд ./Caddyfile нашёл файл:
#   cp .env.example .env   # заполнить
#   docker compose -f docker-compose.standalone.yml up -d --build
#
# Caddy on-demand TLS: сертификат выпускается при первом запросе, когда домен уже
# указывает на этот узел (после фейловера DNS переключится сюда автоматически).

services:
  app:
    build:
      context: .
      args:
        # zapret в образ: поставь INSTALL_ZAPRET=1 в .env → в образе будет nfqws.
        INSTALL_ZAPRET: "${INSTALL_ZAPRET:-0}"
    image: sub-cluster
    container_name: sub-cluster-app
    restart: unless-stopped
    env_file: .env
    environment:
      LISTEN_HOST: "0.0.0.0"
      ADMIN_PORT: "8080"
      SUB_PORT: "8081"
      CLUSTER_PORT: "8083"
      DB_FILE: "/data/cluster.db"
      PYTHONUNBUFFERED: "1"
      # Применять обход к egress (нужно INSTALL_ZAPRET=1 + cap_add ниже). 0 = только baseline.
      ZAPRET_ENABLE_APPLY: "${ZAPRET_ENABLE_APPLY:-0}"
    volumes:
      - cluster-data:/data
    # zapret (обход DPI): права на NFQUEUE/iptables. Работают вместе с INSTALL_ZAPRET=1 +
    # ZAPRET_ENABLE_APPLY=1 (.env). Если zapret не используешь — можно закомментировать.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # чтобы контейнер мог дёрнуть redeploy-agent на ХОСТЕ (http://host.docker.internal:9090)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Наружу ничего публиковать не нужно: Caddy ходит к app по внутренней сети,
    # а другие узлы кластера — через ADMIN_DOMAIN по 443 (peer-API на 8080).
    expose:
      - "8080"
      - "8081"

  caddy:
    image: caddy:2
    container_name: sub-cluster-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Домены берутся из .env: ADMIN_DOMAIN (статичный admin этого узла),
      # SUB_DOMAIN (общий домен подписок).
      ADMIN_DOMAIN: "${ADMIN_DOMAIN}"
      SUB_DOMAIN: "${SUB_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  cluster-data:
  caddy-data:
  caddy-config:
